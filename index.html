<title>Daily Wellness — Toyama Grouses</title>
<style>
  :root {
    --red: #c8102e;
    --red-dark: #9c0c23;
    --bg: #f7f5f4;
    --card-bg: #ffffff;
    --text: #1c1c1c;
    --text-muted: #6b6b6b;
    --border: #e6e2e0;
    --shadow: 0 2px 10px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --card-bg: #232426; --text: #f1efee;
      --text-muted: #a3a3a3; --border: #35363a; --shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --card-bg: #232426; --text: #f1efee;
    --text-muted: #a3a3a3; --border: #35363a; --shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; min-height: 100vh; }
  @media (min-width: 700px) {
    #app { max-width: 1100px; padding: 44px 40px 90px; }
    .header { margin-bottom: 36px; }
    .badge { width: 72px; height: 72px; border-radius: 16px; }
    .header h1 { font-size: 30px; }
    .header .sub { font-size: 17px; margin-top: 5px; }
    .card { padding: 44px; border-radius: 22px; }
    .roster-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .player-btn { padding: 44px 24px; font-size: 26px; border-radius: 20px; min-height: 130px; }
    .q-title { font-size: 22px; }
    .q-sub { font-size: 16px; }
    .q-value { width: 52px; height: 52px; font-size: 21px; border-radius: 12px; }
    input[type=range]::-webkit-slider-thumb { width: 38px; height: 38px; }
    input[type=range]::-moz-range-thumb { width: 38px; height: 38px; }
    input[type=range] { height: 9px; }
    .primary-btn { padding: 24px; font-size: 21px; border-radius: 18px; }
    .back-link { font-size: 18px; }
    .done-check { font-size: 72px; }
    .done-title { font-size: 25px; }
    .done-sub { font-size: 17px; }
  }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .badge {
    width: 44px; height: 44px; border-radius: 10px; background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .badge img { width: 100%; height: 100%; object-fit: cover; }
  .header h1 { font-size: 18px; margin: 0; line-height: 1.25; }
  .header .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .player-btn {
    padding: 14px 10px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text); font-size: 14px; font-weight: 600;
    cursor: pointer; text-align: center; transition: transform 0.08s ease;
  }
  .player-btn:active { transform: scale(0.97); }
  .back-link {
    background: none; border: none; color: var(--red); font-size: 14px; font-weight: 600;
    cursor: pointer; padding: 4px 0 14px; display: inline-block;
  }
  .q-block { margin-bottom: 26px; }
  .q-title { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .q-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; }
  .slider-row { display: flex; align-items: center; gap: 14px; }
  input[type=range] {
    flex: 1; -webkit-appearance: none; height: 6px; border-radius: 3px;
    background: var(--border); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--red); cursor: pointer; border: 3px solid var(--card-bg);
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  input[type=range]::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%; background: var(--red);
    cursor: pointer; border: 3px solid var(--card-bg);
  }
  .q-value {
    width: 34px; height: 34px; border-radius: 8px; background: var(--red); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: 15px; flex-shrink: 0;
  }
  .primary-btn {
    width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--red);
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .primary-btn:disabled { opacity: 0.5; }
  .primary-btn:active { background: var(--red-dark); }
  .done-check { font-size: 46px; text-align: center; margin: 10px 0; }
  .done-title { text-align: center; font-size: 17px; font-weight: 700; margin: 0 0 4px; }
  .done-sub { text-align: center; font-size: 13px; color: var(--text-muted); margin: 0 0 20px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px;
    font-size: 13px; box-shadow: var(--shadow); z-index: 50; max-width: 90vw;
    text-align: center; white-space: normal;
  }
</style>
</head>

    {g:"G57",date:"2027-04-24",opp:"Alvark Tokyo",home:true},
    {g:"G58",date:"2027-04-25",opp:"Alvark Tokyo",home:true},
    {g:"G59",date:"2027-04-27",opp:"San-en NeoPhoenix",home:false},
    {g:"G60",date:"2027-04-30",opp:"Hiroshima Dragonflies",home:false}
  ];

  function diffDays(a, b) {
    return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
  }

  function getDayContext(dateStr) {
    var match = SEASON_GAMES.filter(function (g) { return g.date === dateStr; })[0];
    if (match) return { tag: "MD", opponent: (match.home ? "vs " : "@ ") + match.opp };
    var future = SEASON_GAMES.filter(function (g) { return g.date > dateStr; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0];
    var past = SEASON_GAMES.filter(function (g) { return g.date < dateStr; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; })[0];
    var futDiff = future ? diffDays(dateStr, future.date) : null;
    var pastDiff = past ? diffDays(past.date, dateStr) : null;
    if (futDiff !== null && (pastDiff === null || futDiff <= pastDiff)) {
      return { tag: "MD-" + futDiff, opponent: (future.home ? "vs " : "@ ") + future.opp };
    }
    if (pastDiff !== null) {
      return { tag: "MD+" + pastDiff, opponent: (past.home ? "vs " : "@ ") + past.opp };
    }
    return { tag: "—", opponent: "" };
  }

  var state = {
    screen: "select",
    player: null,
    answers: {},
    saving: false,
    badgeTaps: 0,
    badgeTapTimer: null,
    doneTimer: null
  };
  QUESTIONS.forEach(function (q) { state.answers[q.key] = 5; });

  function todayKey() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

  function bi(en, jp) {
    return el("span", {}, [en, el("br"), el("span", { style: "font-size:0.85em;opacity:0.7;font-weight:400;" }, [jp])]);
  }

  function toast(msg) {
    var t = el("div", { class: "toast" }, [msg]);
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

  function render() {
    var app = document.getElementById("app");
    app.innerHTML = "";
    app.appendChild(renderHeader());
    if (state.screen === "select") app.appendChild(renderSelect());
    else if (state.screen === "survey") app.appendChild(renderSurvey());
    else if (state.screen === "done") app.appendChild(renderDone());
  }

  function renderHeader() {
    return el("div", { class: "header" }, [
      el("div", { class: "badge", onclick: handleBadgeTap }, [el("img", { src: LOGO_DATA_URI, alt: "Toyama Grouses" })]),
      el("div", {}, [
        el("h1", {}, ["Daily Wellness · デイリーウェルネス"]),
        el("div", { class: "sub" }, [todayKey()])
      ])
    ]);
  }

  function handleBadgeTap() {
    if (state.screen !== "select") return;
    state.badgeTaps += 1;
    if (state.badgeTapTimer) clearTimeout(state.badgeTapTimer);
    state.badgeTapTimer = setTimeout(function () { state.badgeTaps = 0; }, 1500);
    if (state.badgeTaps >= 5) {
      state.badgeTaps = 0;
      window.open(SHEET_URL, "_blank");
    }
  }

  function renderSelect() {
    var wrap = el("div", {}, []);
    wrap.appendChild(el("div", { class: "card" }, [
      el("p", { class: "q-sub", style: "text-transform:uppercase;font-weight:700;letter-spacing:.03em;" }, ["Select your name · 名前を選択"]),
      el("div", { class: "roster-grid" }, ROSTER.map(function (p) {
        return el("button", { class: "player-btn", onclick: function () { selectPlayer(p); } }, ["#" + p.num + " " + p.name]);
      }))
    ]));
    return wrap;
  }

  function selectPlayer(p) {
    state.player = p;
    state.screen = "survey";
    QUESTIONS.forEach(function (q) { state.answers[q.key] = 5; });
    render();
  }

  function renderSurvey() {
    var wrap = el("div", {}, []);
    wrap.appendChild(el("button", {
      class: "back-link",
      onclick: function () { state.screen = "select"; state.player = null; render(); }
    }, ["‹ Change player · 選手を変更"]));

    var card = el("div", { class: "card" }, []);
    card.appendChild(el("p", { class: "q-sub", style: "text-transform:uppercase;font-weight:700;letter-spacing:.03em;" }, [state.player.name]));

    QUESTIONS.forEach(function (q) {
      var valBox = el("div", { class: "q-value" }, [String(state.answers[q.key])]);
      var slider = el("input", {
        type: "range", min: "1", max: "10", step: "1", value: String(state.answers[q.key]),
        oninput: function (e) { state.answers[q.key] = parseInt(e.target.value, 10); valBox.textContent = e.target.value; }
      });
      card.appendChild(el("div", { class: "q-block" }, [
        el("p", { class: "q-title" }, [q.title + " · " + q.jp]),
        el("p", { class: "q-sub" }, ["1 = " + q.low + "   ·   10 = " + q.high]),
        el("div", { class: "slider-row" }, [slider, valBox])
      ]));
    });

    var submitBtn = el("button", { class: "primary-btn", onclick: submitSurvey }, [state.saving ? "Saving... · 保存中..." : "Save response · 保存する"]);
    if (state.saving) submitBtn.setAttribute("disabled", "disabled");
    card.appendChild(submitBtn);
    wrap.appendChild(card);
    return wrap;
  }

  function submitSurvey() {
    if (state.saving) return;
    state.saving = true;
    render();

    var p = state.player;
    var total = QUESTIONS.reduce(function (s, q) { return s + state.answers[q.key]; }, 0);
    var ctx = getDayContext(todayKey());
    var payload = {
      date: todayKey(),
      mdTag: ctx.tag,
      mdOpponent: ctx.opponent,
      num: p.num,
      playerName: p.name,
      sleep: state.answers.sleep,
      energy: state.answers.energy,
      soreness: state.answers.soreness,
      stress: state.answers.stress,
      mood: state.answers.mood,
      total: total,
      average: Math.round((total / 5) * 10) / 10,
      submittedAt: new Date().toISOString()
    };

    fetch(WEBAPP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function () {
      state.saving = false;
      state.screen = "done";
      render();
    }).catch(function () {
      state.saving = false;
      render();
      toast("Couldn't save. Check your connection and try again. / 保存できませんでした。接続を確認してください。");
    });
  }

  function renderDone() {
    if (state.doneTimer) clearTimeout(state.doneTimer);
    state.doneTimer = setTimeout(function () {
      if (state.screen === "done") { state.screen = "select"; state.player = null; render(); }
    }, 5000);
    return el("div", { class: "card" }, [
      el("div", { class: "done-check" }, ["✅"]),
      el("p", { class: "done-title" }, ["Thanks, " + state.player.name.split(" ")[0] + "! · ありがとうございました"]),
      el("p", { class: "done-sub" }, [bi("Your response for today has been saved. Returning to start...", "本日の回答が保存されました。まもなくトップ画面に戻ります…")]),
      el("button", {
        class: "primary-btn",
        onclick: function () { if (state.doneTimer) clearTimeout(state.doneTimer); state.screen = "select"; state.player = null; render(); }
      }, ["Back to start now · 今すぐ戻る"])
    ]);
  }

  render();
})();
</script>
</body>
</html>
